version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Electron majors are upgraded deliberately (see BUILD.md / CHANGELOG.md)
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      # docx >= 9.6 ships a UMD require(x, y) that webpack cannot bundle
      # (breaks `electron-forge package`); held at ~9.5.3, see CHANGELOG.md
      - dependency-name: docx
        versions: [">=9.6.0"]
      # Held with a reason (2026-11 maintenance): Tailwind 4 needs the config
      # moved to CSS. (The ESLint major hold was dropped once the lint setup
      # moved to ESLint 10 + @eslint-react/eslint-plugin.)
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
